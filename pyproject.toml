[project]
name = "fsds26-w5d1"
version = "0.1.0"
description = "FSDS 2026, week 5 day 1: image and sentence embeddings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "huggingface-hub>=2.4.0",
    "ipykernel>=7.4.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "open-clip-torch>=4.2.1",
    "openai>=3.49.0",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "py7zr>=1.1.4",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.14,<2.15",
    "torchvision>=0.29.1",
    "transformers>=5.22.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]